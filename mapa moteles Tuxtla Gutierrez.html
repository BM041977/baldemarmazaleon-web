<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Moteles Tuxtla Gutiérrez — Estudio de Mercado</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --cream: #F2ECDE;
    --dark: #1A1A1A;
    --accent: #B8722E;
    --accent-light: #F3DFC4;
  }
  html, body { margin:0; padding:0; height:100%; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--cream); }
  #header { background:var(--dark); color:#fff; padding:18px 24px 14px; border-bottom:3px solid var(--accent); }
  #header-top { display:flex; align-items:center; gap:16px; }
  #header h1 { margin:0; font-size:20px; font-family: Georgia, serif; letter-spacing:.3px; }
  #header .subtitle { margin:3px 0 0; font-size:12px; color:#9ca3af; }
  #header .stats { margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
  .stat-pill { background:rgba(255,255,255,0.07); border:1px solid rgba(184,114,46,0.4); border-radius:20px; padding:5px 14px; font-size:12px; display:flex; align-items:center; gap:5px; }
  .stat-pill b { color:var(--accent-light); font-size:14px; font-weight:700; }
  #controls { background:#2b2b2b; padding:10px 20px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  #search { padding:7px 12px; border-radius:20px; border:none; font-size:13px; width:200px; background:var(--cream); }
  .filter-chip { background:#4a4a4a; color:var(--cream); border:none; padding:6px 14px; border-radius:20px; font-size:12px; cursor:pointer; user-select:none; }
  .filter-chip.active { background:var(--accent); color:#fff; font-weight:600; }
  #map { height: calc(100% - 128px); width:100%; }
  .leaflet-popup-content { font-size:13px; line-height:1.5; max-width:260px; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  .leaflet-popup-content b { font-size:14px; color:var(--dark); }
  .horario { display:block; margin-top:5px; padding-top:5px; border-top:1px solid var(--accent-light); font-size:12px; color:#374151; }
  .tier-tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; margin-top:6px; }
  .tier-directa { background:var(--accent-light); color:#7A4A1E; }
  .tier-no_repr { background:#e5e7eb; color:#4b5563; }
  .legend { background:var(--cream); padding:10px 14px; border-radius:8px; box-shadow:0 1px 6px rgba(0,0,0,.3); font-size:12px; line-height:1.8; border:1px solid var(--accent); }
  .legend b { display:block; margin-bottom:4px; font-size:12px; color:var(--dark); }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .map-logo { background:#fff; padding:3px 6px; border-radius:8px; box-shadow:0 3px 14px rgba(0,0,0,.28); display:inline-flex; }
  .map-logo img { height:80px; width:auto; display:block; }
  .legend-header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .legend-header b { margin:0; }
  .legend-btns { display:flex; gap:6px; }
  .legend-btn { cursor:pointer; border:none; background:#e5e7eb; color:#374151; border-radius:4px; width:18px; height:18px; font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0; }
  .legend-btn:hover { background:#d1d5db; }
  .legend-body.collapsed { display:none; }
</style>
</head>

    return div;
  };
  logoControl.addTo(map);

  const markers = [];
  data.forEach(loc => {
    // halo detrás del pin para los de competencia directa (reemplaza a las estrellas)
    let halo = null;
    if (loc.tier === 'directa' && !loc.closed) {
      halo = L.circleMarker([loc.latitude, loc.longitude], {
        radius: 15, color: '#facc15', weight: 3, opacity: 1, fill: false, interactive: false
      }).addTo(map);
    }

    const radius = loc.closed ? 7 : 9;
    const weight = loc.tier === 'directa' ? 3 : 2;
    const borderColor = loc.tier === 'directa' ? '#B8722E' : '#fff';
    const marker = L.circleMarker([loc.latitude, loc.longitude], {
      radius: radius, fillColor: loc.color, color: borderColor, weight: weight, fillOpacity: 0.95
    }).addTo(map);

    let tag = '';
    if (loc.tier === 'directa') tag = '<span class="tier-tag tier-directa">★ Competencia directa</span>';
    if (loc.tier === 'no_repr') tag = '<span class="tier-tag tier-no_repr">Bajo perfil — no representativo</span>';

    marker.bindPopup(`<b>${loc.name}</b><br>${loc.notes}<span class="horario"><b>Horario/tarifa:</b> ${loc.horario}</span>${tag}`);

    markers.push({ marker, halo, loc });
  });

  let legendDiv;
  const legend = L.control({position: 'bottomright'});
  legend.onAdd = function() {
    legendDiv = L.DomUtil.create('div', 'legend');
    legendDiv.innerHTML = `
      <div class="legend-header">
        <b>Segmento de precio</b>
        <span class="legend-btns">
          <button class="legend-btn" id="legend-min" title="Minimizar">–</button>
          <button class="legend-btn" id="legend-close" title="Cerrar">×</button>
        </span>
      </div>
      <div class="legend-body" id="legend-body">
        <span class="dot" style="background:#10b981"></span>Económico ($90-199)<br>
        <span class="dot" style="background:#eab308"></span>Medio ($200-299)<br>
        <span class="dot" style="background:#f97316"></span>Medio-alto ($300-399)<br>
        <span class="dot" style="background:#be123c"></span>Premium ($400+)<br>
        <span class="dot" style="background:#64748b"></span>Cerrado<br>
        <b style="margin-top:6px; display:block;">Relevancia</b>
        <span class="dot" style="background:transparent; border:3px solid #facc15;"></span>Anillo dorado = competencia directa
      </div>
    `;
    L.DomEvent.disableClickPropagation(legendDiv);
    return legendDiv;
  };
  legend.addTo(map);

  document.getElementById('legend-min').addEventListener('click', () => {
    document.getElementById('legend-body').classList.toggle('collapsed');
  });
  document.getElementById('legend-close').addEventListener('click', () => {
    legendDiv.style.display = 'none';
  });

  // --- filtros ---
  let activeSegment = 'all';
  let onlyDirecta = false;

  function applyFilters() {
    const q = searchInput.value.trim().toLowerCase();
    markers.forEach(({ marker, halo, loc }) => {
      let visible = true;
      if (q && !loc.name.toLowerCase().includes(q)) visible = false;
      if (activeSegment !== 'all' && loc.segment !== activeSegment) visible = false;
      if (onlyDirecta && loc.tier !== 'directa') visible = false;

      if (visible) {
        if (!map.hasLayer(marker)) marker.addTo(map);
        if (halo && !map.hasLayer(halo)) halo.addTo(map);
      } else {
        if (map.hasLayer(marker)) map.removeLayer(marker);
        if (halo && map.hasLayer(halo)) map.removeLayer(halo);
      }
    });
  }

  const searchInput = document.getElementById('search');
  const suggestionsBox = document.getElementById('suggestions');

  function showSuggestions() {
    const q = searchInput.value.trim().toLowerCase();
    suggestionsBox.innerHTML = '';
    const pool = q ? data.filter(loc => loc.name.toLowerCase().includes(q)) : data;
    const matches = pool.slice(0, 30);
    if (matches.length === 0) { suggestionsBox.style.display = 'none'; return; }
    matches.forEach(loc => {
      const item = document.createElement('div');
      item.textContent = loc.name.replace(/\s*\(\$[^)]*\)\s*$/, '');
      item.style.cssText = 'padding:8px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid #f0ebe0; color:#1A1A1A;';
      item.addEventListener('mouseenter', () => item.style.background = '#F3DFC4');
      item.addEventListener('mouseleave', () => item.style.background = '#fff');
      item.addEventListener('click', () => {
        searchInput.value = loc.name.replace(/\s*\(\$[^)]*\)\s*$/, '');
        toggleClearBtn();
        suggestionsBox.style.display = 'none';

        // quitar filtros que puedan estar ocultando este motel en particular
        activeSegment = 'all';
        onlyDirecta = false;
        document.querySelectorAll('.filter-chip[data-filter]').forEach(b => b.classList.remove('active'));
        document.querySelector('.filter-chip[data-filter="all"]').classList.add('active');
        document.getElementById('btn-directa').textContent = '★ Ver solo competencia directa';

        applyFilters();
        const found = markers.find(m => m.loc.place_id === loc.place_id);
        if (found) {
          map.setView([loc.latitude, loc.longitude], 16);
          setTimeout(() => found.marker.openPopup(), 150);
        }
      });
      suggestionsBox.appendChild(item);
    });
    suggestionsBox.style.display = 'block';
  }

  const clearBtn = document.getElementById('clear-search');

  function toggleClearBtn() {
    clearBtn.style.display = searchInput.value ? 'block' : 'none';
  }

  searchInput.addEventListener('input', () => { applyFilters(); showSuggestions(); toggleClearBtn(); });
  searchInput.addEventListener('focus', showSuggestions);
  toggleClearBtn();

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    toggleClearBtn();
    applyFilters();
    showSuggestions();
    searchInput.focus();
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#search') && !e.target.closest('#suggestions') && !e.target.closest('#clear-search')) {
      suggestionsBox.style.display = 'none';
    }
  });

  document.querySelectorAll('.filter-chip[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      const f = btn.dataset.filter;
      if (f === 'directa') {
        onlyDirecta = !onlyDirecta;
        btn.classList.toggle('active', onlyDirecta);
        btn.textContent = onlyDirecta ? '✓ Mostrando solo competencia directa' : '★ Ver solo competencia directa';
      } else {
        activeSegment = f;
        document.querySelectorAll('.filter-chip[data-filter]:not(#btn-directa)').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      applyFilters();
    });
  });
</script>
</body>
</html>
